<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faisinliora Jewels – Coming Soon</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@0;1&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    width: 100%;
  }

  body {
    background: #faf8f5;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    min-height: 100dvh;
  }

  .wrap {
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  .inner {
    text-align: center;
    width: 100%;
    max-width: 560px;
  }

  .logo {
    font-family: 'Playfair Display', serif;
    font-size: clamp(22px, 5vw, 34px);
    color: #2c2420;
    letter-spacing: 0.04em;
    margin-bottom: 10px;
    font-weight: 400;
  }

  .line {
    width: 36px;
    height: 1px;
    background: #b89c7a;
    margin: 0 auto 28px;
  }

  .tag {
    font-family: 'Jost', sans-serif;
    font-size: clamp(10px, 1.5vw, 11px);
    letter-spacing: 0.35em;
    color: #b89c7a;
    text-transform: uppercase;
    margin-bottom: 18px;
  }

  .headline {
    font-family: 'Playfair Display', serif;
    font-size: clamp(28px, 6vw, 46px);
    font-style: italic;
    color: #2c2420;
    line-height: 1.25;
    margin-bottom: 18px;
    font-weight: 400;
  }

  .sub {
    font-family: 'Jost', sans-serif;
    font-size: clamp(13px, 2vw, 15px);
    font-weight: 300;
    color: #8a7a6a;
    line-height: 1.9;
    margin-bottom: 32px;
  }

  .url {
    font-family: 'Jost', sans-serif;
    font-size: clamp(11px, 1.5vw, 12px);
    letter-spacing: 0.2em;
    color: #c5b9aa;
  }

  @media (max-width: 400px) {
    .headline br { display: none; }
    .sub br { display: none; }
  }

  @media (min-height: 900px) {
    .inner { padding: 20px 0; }
    .line { margin-bottom: 36px; }
    .tag { margin-bottom: 24px; }
    .headline { margin-bottom: 22px; }
    .sub { margin-bottom: 40px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="inner">
    <div class="logo">Faisinliora Jewels</div>
    <div class="line"></div>
    <div class="tag">Coming Soon</div>
    <h1 class="headline">Something beautiful<br>is on its way</h1>
    <p class="sub">Handcrafted jewellery made with care.<br>We're putting the finishing touches.</p>
    <div class="url">faisinliorajewels.shop</div>
  </div>
</div>
</body>
</html>
